name: lint

# Formatting and dependency hygiene (P5-#21, P6-D12). Deliberately separate from
# the validation gate: a formatting complaint and a failing test are not the same
# signal, and reading one run to learn which of the two happened wastes time.
#
# Every check degrades to an explicit skip rather than to a silent pass: a step
# that reports "skipped, no spotless plugin" is auditable, one that quietly
# exits 0 is not.

on:
  workflow_call:
    inputs:
      stack:
        description: "backend | frontend | harness | other"
        required: true
        type: string
      java_version:
        required: false
        type: string
        default: "21"
      node_version:
        required: false
        type: string
        default: "22"
      working_directory:
        required: false
        type: string
        default: "."
    secrets:
      nvd_api_key:
        description: >-
          NVD API key. OWASP dependency-check 13 refuses to build its database
          without one. Absent, the backend vulnerability scan reports a skip
          instead of failing - see the audit job.
        required: false

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        if: inputs.stack == 'backend'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Spotless
        if: inputs.stack == 'backend'
        run: |
          if grep -q 'spotless-maven-plugin' pom.xml 2>/dev/null; then
            ./mvnw -B -q spotless:check
          else
            echo "skipped: no spotless-maven-plugin in pom.xml"
            echo "- format: **skipped**, no spotless-maven-plugin" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: inputs.stack == 'frontend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          # defaults.run.working-directory does not reach an action's inputs:
          # without this, setup-node looks for the lockfile at the repo root and
          # fails before npm ci on any project that is not at the root.
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install
        if: inputs.stack == 'frontend'
        run: npm ci

      - name: Prettier
        if: inputs.stack == 'frontend'
        run: |
          if [ -n "$(ls .prettierrc* prettier.config.* 2>/dev/null)" ] \
             || node -e 'process.exit(require("./package.json").prettier?0:1)' 2>/dev/null; then
            npx --no-install prettier --check .
          else
            echo "skipped: no prettier configuration"
            echo "- prettier: **skipped**, not configured" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lint
        if: inputs.stack == 'frontend'
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.lint?0:1)' 2>/dev/null; then
            npm run lint
          else
            echo "skipped: no lint script in package.json"
            echo "- lint: **skipped**, no script" >> "$GITHUB_STEP_SUMMARY"
          fi

      # P5-#21: `other` and `harness` accepted this workflow and ran no check at
      # all, so `deployment` and `summerize-youtube` were linted by nothing. What
      # those repositories actually hold is shell and YAML, and that is what the
      # two steps below check. A Node backend declared `other` (summerize-youtube)
      # gets no eslint here - it is the price of the stack label it chose, and it
      # is written down rather than discovered.
      - name: ShellCheck
        if: inputs.stack == 'other' || inputs.stack == 'harness'
        run: |
          # -print0/-d '' so a path with a space is one argument, not two.
          mapfile -d '' -t scripts < <(
            find . -path ./.git -prune -o -type f -name '*.sh' -print0
          )
          # A shell script without the .sh suffix is the common case for a hook
          # or a CLI entry point: take anything executable whose shebang is a
          # shell, which is how the harness ships hooks/mirror-sync.sh's siblings.
          while IFS= read -r -d '' f; do
            head -c 2 "$f" | grep -q '#!' || continue
            head -1 "$f" | grep -qE '^#!.*\b(bash|sh|dash|ksh)\b' || continue
            case " ${scripts[*]-} " in *" $f "*) continue ;; esac
            scripts+=("$f")
          done < <(find . -path ./.git -prune -o -type f -perm -u+x -print0)

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "skipped: no shell script found"
            echo "- shellcheck: **skipped**, no shell script" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! command -v shellcheck > /dev/null; then
            echo "skipped: shellcheck not installed on this runner"
            echo "- shellcheck: **skipped**, not installed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'shellcheck: %d script(s)\n' "${#scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

      - name: YAML syntax
        if: inputs.stack == 'other' || inputs.stack == 'harness'
        run: |
          mapfile -d '' -t docs < <(
            find . -path ./.git -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print0
          )
          if [ "${#docs[@]}" -eq 0 ]; then
            echo "skipped: no YAML file found"
            echo "- yaml: **skipped**, no YAML file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! python3 -c 'import yaml' 2>/dev/null; then
            # Installing beats skipping here: an unparseable compose file is
            # exactly the failure this branch exists to catch.
            python3 -m pip install --quiet --disable-pip-version-check pyyaml
          fi
          printf 'yaml: %d document(s)\n' "${#docs[@]}"
          python3 - "${docs[@]}" <<'PYEOF'
          import sys, yaml
          failed = []
          for path in sys.argv[1:]:
              try:
                  with open(path) as handle:
                      list(yaml.safe_load_all(handle))
              except yaml.YAMLError as error:
                  failed.append(f"{path}: {error}")
          for line in failed:
              print(line, file=sys.stderr)
          sys.exit(1 if failed else 0)
          PYEOF

  # Non-blocking until the first go-live (P6-D12). It reports, it does not gate:
  # a transitive advisory with no fix available must not stop a lot.
  #
  # The non-blocking part is carried by continue-on-error on the two scan steps,
  # not on the job. A job-level continue-on-error still publishes the check run
  # with conclusion "failure": the pull request shows a red check that §7 says is
  # never to be merged, for a signal that was declared informative. An
  # informative check that renders red teaches the reader to ignore red.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: inputs.stack == 'frontend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          # defaults.run.working-directory does not reach an action's inputs:
          # without this, setup-node looks for the lockfile at the repo root and
          # fails before npm ci on any project that is not at the root.
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: npm audit
        if: inputs.stack == 'frontend'
        continue-on-error: true
        run: |
          npm audit --audit-level=high || {
            echo "- npm audit: **advisories reported**, see the step log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Set up Java
        if: inputs.stack == 'backend'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Dependency vulnerabilities
        if: inputs.stack == 'backend'
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.nvd_api_key }}
        run: |
          # dependency-check 13 builds its database from the NVD API and that API
          # now rejects unauthenticated callers outright ("Invalid API Key, length
          # of 0"). Without a key the plugin does not report zero findings, it
          # aborts before analysing anything - a skip that says so beats a red
          # check that says nothing.
          if [ -z "$NVD_API_KEY" ]; then
            echo "skipped: no NVD API key configured"
            echo "- dependency-check: **skipped**, no \`NVD_API_KEY\` secret" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./mvnw -B -q org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=11 -DnvdApiKey="$NVD_API_KEY"
