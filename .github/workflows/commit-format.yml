name: commit-format

# Conventional Commits, in English, no ambiguous non-ASCII (CONVENTIONS.md
# sections 7 and 10). Checks only the commits the branch adds, never the history
# it inherits.

on:
  workflow_call:
    inputs:
      types:
        description: "Allowed commit types, pipe-separated"
        required: false
        type: string
        default: "feat|fix|refactor|test|chore|docs|build|ci|perf|revert|style"

permissions:
  contents: read

jobs:
  commit-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine the range of added commits
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
            echo "range=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "range=$BEFORE..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # New branch or unresolvable base: check the tip only rather than
            # failing a whole inherited history nobody is adding here.
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Every added commit follows the convention
        env:
          RANGE: ${{ steps.range.outputs.range }}
          TYPES: ${{ inputs.types }}
        run: |
          status=0
          # --no-merges: a merge commit subject is generated by GitHub and is not
          # ours to format.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            sha=${line%% *}
            subject=${line#* }

            if ! printf '%s' "$subject" | grep -qE "^($TYPES)(\([a-z0-9._/-]+\))?!?: .+"; then
              echo "::error::$sha: subject is not Conventional Commits <type>(<scope>): <message>"
              echo "         got: $subject"
              status=1
              continue
            fi

            # 72 is the git wrapping convention, 72 is not a hard rule; GitHub
            # truncates the subject in its UI around 100, and a truncated
            # subject is genuinely unreadable. Warn at one, fail at the other.
            if [ "${#subject}" -gt 100 ]; then
              echo "::error::$sha: subject is ${#subject} characters, GitHub truncates it"
              status=1
            elif [ "${#subject}" -gt 72 ]; then
              echo "::warning::$sha: subject is ${#subject} characters, aim for 72"
            fi

            # U+2014 em dash: ambiguous in a terminal, banned by section 10.
            if printf '%s' "$subject" | grep -q '—'; then
              echo "::error::$sha: subject contains an em dash (U+2014), use an en dash"
              status=1
            fi

            message=$(printf '%s' "${subject#*: }")
            case "$message" in
              [A-Z]*)
                echo "::error::$sha: the message starts with a capital, keep it lower case"
                status=1 ;;
            esac
            case "$message" in
              *.) echo "::error::$sha: the subject ends with a period"; status=1 ;;
            esac
          done <<< "$(git log --no-merges --format='%H %s' "$RANGE")"
          exit $status

      - name: No commit subject written in French
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          # Section 7: commit titles are English. A word list beats a language
          # detector here: these are the words that actually showed up.
          # Standalone words only: a fragment like "des" inside an English word
          # would fire on half the history.
          pattern='\b(ajoute|ajoute?s|ajout|corrige|correction|supprime|suppression|modifie|deplace|renomme|refonte|utilise|permet|dans|pour|avec|selon|depuis|lorsque|afin)\b'
          hits=$(git log --no-merges --format='%H %s' "$RANGE" | grep -iE "$pattern" || true)
          if [ -n "$hits" ]; then
            echo "::error::commit subjects must be written in English (section 7):"
            echo "$hits"
            exit 1
          fi
